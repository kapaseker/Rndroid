[package]
name = "rndroid"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[dependencies]
jni = "0.21.1"
log = "0.4.20"
android_logger = "0.15.1"
uuid = { version = "1.10", features = ["v4", "fast-rng"] }

[lib]
crate-type = ["staticlib", "dylib"]
